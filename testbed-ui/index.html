<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>xoft testbed</title>
    <style>
      body { font-family: monospace; margin: 1rem; }
      textarea { width: 100%; height: 8rem; }
      pre { background: #eee; padding: 0.5rem; white-space: pre-wrap; }
      section { margin-bottom: 1.5rem; }
    </style>
  </head>
  <body>
    <p>
      M6.1 placeholder UI &mdash; proves the three Tauri commands are callable end to end.
      The real UI (Monaco <code>DiffEditor</code>, layout) is M6.2.
    </p>

    <section>
      <h2>list_corpus</h2>
      <textarea id="roots-toml">[[root]]
alias = "cases"
path = "../corpus/cases"
origin = "local"
license = "MIT"
</textarea>
      <button id="list-corpus-run">Run</button>
      <pre id="list-corpus-out"></pre>
    </section>

    <section>
      <h2>roundtrip_check</h2>
      <textarea id="roundtrip-source">MODULE M;
BEGIN
END M.
</textarea>
      <button id="roundtrip-run">Run</button>
      <pre id="roundtrip-out"></pre>
    </section>

    <section>
      <h2>transpile</h2>
      <select id="transpile-direction">
        <option value="oberon-x-to-oberon2">Oberon-X &rarr; Oberon-2</option>
        <option value="oberon2-to-oberon-x">Oberon-2 &rarr; Oberon-X</option>
      </select>
      <textarea id="transpile-source">MODULE M;
BEGIN
  UNLESS x DO y := 1 END
END M.
</textarea>
      <button id="transpile-run">Run</button>
      <pre id="transpile-out"></pre>
    </section>

    <script>
      const { invoke } = window.__TAURI__.core;

      function wire(buttonId, outId, run) {
        document.getElementById(buttonId).addEventListener("click", async () => {
          const out = document.getElementById(outId);
          try {
            out.textContent = JSON.stringify(await run(), null, 2);
          } catch (e) {
            out.textContent = "error: " + e;
          }
        });
      }

      wire("list-corpus-run", "list-corpus-out", () =>
        invoke("list_corpus", { rootsToml: document.getElementById("roots-toml").value })
      );

      wire("roundtrip-run", "roundtrip-out", () =>
        invoke("roundtrip_check", {
          filename: "scratch.mod",
          raw: Array.from(new TextEncoder().encode(document.getElementById("roundtrip-source").value)),
        })
      );

      wire("transpile-run", "transpile-out", () =>
        invoke("transpile", {
          direction: document.getElementById("transpile-direction").value,
          text: document.getElementById("transpile-source").value,
        })
      );
    </script>
  </body>
</html>

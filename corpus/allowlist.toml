# Corpus exclusions (D8): files excluded from the parse/round-trip pass-fail count,
# capped at 5% of the corpus (~40 of 792 files). Each entry needs a one-line reason.
# Built from an actual `xoft corpus run` (round 32), not ported blind from prior
# grammar-milestone notes -- every reason below was re-confirmed against the file's real
# bytes/diagnostic this round. 26/792 (3.28%), all round-trip clean; every failure is a
# parse-only gap. See docs/progress/m4-corpus-runner.md for the full derivation.

# --- Amiga Oberon's real conditional-compilation preprocessor (comment-embedded $IF/
# $ELSE/$END or bracket-pragma <*IF*>/<*ELSE*>/<*END*>): both branches' full code present
# unconditionally, no separator token between them -- no single Oberon-2 parse tree can
# represent this; needs a text-preprocessing pass keyed on pragma symbols. Phase 2 backlog
# (docs/progress/m1-grammar.md rounds 20/23/25).
[[entry]]
root = "amiga-oberon-31"
path = "Module/Break.mod"
reason = "dual pragma-guarded MODULE headers ($IF BreakRq / $ELSE / $END), conditional-compilation preprocessor not implemented"

[[entry]]
root = "amiga-oberon-31"
path = "Module/NoGuru.mod"
reason = "dual pragma-guarded MODULE headers, same conditional-compilation preprocessor gap as Break.mod"


[workspace]
resolver = "2"
members = ["crates/xoft-core", "crates/xoft-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mrolappe/xoft"

[workspace.dependencies]
xoft-core = { path = "crates/xoft-core" }
tree-sitter = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
